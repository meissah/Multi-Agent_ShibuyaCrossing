<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparaison Simulations - Shibuya Crossing</title>
    
    <!-- Fichier CSS externe pour les styles -->
    <link rel="stylesheet" href="dashboard.css">
    
    <!-- Bibliothèque Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1> Comparaison des Simulations </h1>
                <p class="subtitle">Analyse comparative : Shibuya vs French Crossing</p>
            </div>
        </header>

        <div id="content"></div>
    </div>

    <script>
        // ========================================
        // VARIABLES GLOBALES
        // ========================================
        
        let shibuyaData = null;  // Données de simulation Shibuya
        let frenchData = null;   // Données de simulation French
        let charts = {};         // Stockage des instances de graphiques Chart.js

        // ========================================
        // CHARGEMENT DES DONNÉES DEPUIS L'API
        // ========================================
        
        async function loadData() {
            const content = document.getElementById('content');
            content.innerHTML = '<div class="loading">Chargement des données...</div>';

            try {
                // Appel à l'API ->  récup les résultats de comparaison
                const response = await fetch('http://localhost:8080/api/comparison');
                const data = await response.json();

                // Vérifie que les deux types de simulations sont disponibles 
                if (data.ShibuyaAvailable && data.FrenchAvailable) {
                    // Convertir le format API vers le format attendu par le dashboard
                    shibuyaData = {
                        avgCarLifetime: data.ShibuyaStats.AvgCarLifetime,
                        avgPedLifetime: data.ShibuyaStats.AvgPedLifetime,
                        totalCars: data.ShibuyaStats.TotalCars,
                        totalPeds: data.ShibuyaStats.TotalPeds
                    };
                    frenchData = {
                        avgCarLifetime: data.FrenchStats.AvgCarLifetime,
                        avgPedLifetime: data.FrenchStats.AvgPedLifetime,
                        totalCars: data.FrenchStats.TotalCars,
                        totalPeds: data.FrenchStats.TotalPeds
                    };
                    renderDashboard();
                } else {
                    content.innerHTML = '<div class="error"> Aucune donnée disponible. Lance au moins une simulation Shibuya et une simulation French.</div>';
                }
            } catch (error) {
                content.innerHTML = `<div class="error"> Erreur de connexion à l'API: ${error.message}<br>Assure-toi que la simulation Go est lancée.</div>`;
            }
        }

        // ========================================
        // GÉNÉRATION DU HTML DU DASHBOARD
        // ========================================
        
        function renderDashboard() {
            const html = `
                <!-- Grille de statistiques : Voitures et Piétons -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3><span class="icon">🚗</span> Voitures</h3>
                        <div class="stat-row">
                            <div class="stat-item">
                                <div class="stat-label">Shibuya</div>
                                <div class="stat-value" style="color: #00d4ff;">${shibuyaData.totalCars}</div>
                                <div class="stat-sub">${shibuyaData.avgCarLifetime.toFixed(1)}s moyenne</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">French</div>
                                <div class="stat-value" style="color: #a78bfa;">${frenchData.totalCars}</div>
                                <div class="stat-sub">${frenchData.avgCarLifetime.toFixed(1)}s moyenne</div>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card">
                        <h3><span class="icon">🚶</span> Piétons</h3>
                        <div class="stat-row">
                            <div class="stat-item">
                                <div class="stat-label">Shibuya</div>
                                <div class="stat-value" style="color: #51cf66;">${shibuyaData.totalPeds}</div>
                                <div class="stat-sub">${shibuyaData.avgPedLifetime.toFixed(1)}s moyenne</div>
                            </div>
                            <div class="stat-item">
                                <div class="stat-label">French</div>
                                <div class="stat-value" style="color: #ff9800;">${frenchData.totalPeds}</div>
                                <div class="stat-sub">${frenchData.avgPedLifetime.toFixed(1)}s moyenne</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Histogramme de comparaison des temps moyens -->
                <div class="comparison-card">
                    <h2> Comparaison des Temps Moyens de Traversée</h2>
                    <div class="chart-container">
                        <canvas id="comparisonBarChart"></canvas>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
            renderCharts();
        }

        // ========================================
        // CRÉATION DES GRAPHIQUES CHART.JS
        // ========================================
        
        function renderCharts() {
            // Détruire les anciens graphiques pour éviter les fuites mémoire
            Object.values(charts).forEach(chart => chart.destroy());
            charts = {};

            // ----------------------------------------
            // Histogramme de comparaison des moyennes
            // ----------------------------------------
            const ctx3 = document.getElementById('comparisonBarChart').getContext('2d');
            charts.comparisonBar = new Chart(ctx3, {
                type: 'bar',
                data: {
                    labels: ['Temps Voitures', 'Temps Piétons'],
                    datasets: [{
                        label: 'Shibuya',
                        data: [shibuyaData.avgCarLifetime, shibuyaData.avgPedLifetime],
                        backgroundColor: 'rgba(0, 212, 255, 0.7)',
                        borderColor: '#00d4ff',
                        borderWidth: 2
                    }, {
                        label: 'French',
                        data: [frenchData.avgCarLifetime, frenchData.avgPedLifetime],
                        backgroundColor: 'rgba(167, 139, 250, 0.7)',
                        borderColor: '#a78bfa',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            labels: { 
                                color: '#fff', 
                                font: { size: 14 }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30, 41, 59, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: '#475569',
                            borderWidth: 1,
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(1) + 's';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#fff' },
                            title: {
                                display: true,
                                text: 'Temps moyen (secondes)',
                                color: '#fff'
                            }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.1)' },
                            ticks: { color: '#fff' }
                        }
                    }
                }
            });
        }

        // ========================================
        // INITIALISATION AU CHARGEMENT DE LA PAGE
        // ========================================
        
        loadData();
    </script>
</body>
</html>
